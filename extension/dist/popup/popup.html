<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Click to Call</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Click to Call</h1>
      <form id="settings-form">
        <label>
          <span>Relay URL</span>
          <input id="relay-url" name="relayUrl" type="url" placeholder="https://.../relay" required />
        </label>
        <label>
          <span>Device token</span>
          <input id="device-token" name="deviceToken" type="text" placeholder="paired-device-token" required />
        </label>
        <label class="checkbox-row">
          <input id="enabled" name="enabled" type="checkbox" />
          <span>Enable click-to-call on pages</span>
        </label>
        <button type="submit">Save</button>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
      <section>
        <h2>Recent sends</h2>
        <ul id="history" class="history"></ul>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
